<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Open a pin in Loadstone</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'%3E%3Crect width='108' height='108' rx='24' fill='%23161A54'/%3E%3Cpath d='M54 82V32M36 51l18-19 18 19' stroke='%23EDEEF6' stroke-width='12' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0B0D16;--ink-2:#141829;--paper:#EDEEF6;--indigo:#5B6BF0;--muted:#8A90AD;
    --line:rgba(237,238,246,.10);
    --display:"Space Grotesk",system-ui,sans-serif;
    --body:"IBM Plex Sans",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;
    background:
      radial-gradient(circle at 50% 8%,rgba(91,107,240,.16),transparent 58%),
      var(--ink);
    color:var(--paper);font-family:var(--body);line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .card{width:100%;max-width:420px;text-align:center}
  .mark{width:74px;height:74px;margin:0 auto 24px;display:block}
  .eyebrow{
    font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--muted);margin:0 0 10px;
  }
  h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.15;letter-spacing:-.02em;margin:0 0 6px;word-break:break-word}
  .note{color:#C3C7DC;margin:0 0 4px}
  .coords{font-family:var(--mono);font-size:13px;color:var(--muted);margin:14px 0 26px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    padding:15px 22px;border-radius:999px;text-decoration:none;font-weight:500;font-size:16px;
    border:1px solid transparent;margin-bottom:11px;transition:background .16s,border-color .16s;
  }
  .btn-primary{background:var(--indigo);color:#fff}
  .btn-primary:hover{background:#6F7DF5}
  .btn-ghost{border-color:var(--line);color:var(--paper)}
  .btn-ghost:hover{border-color:rgba(237,238,246,.32)}
  .hint{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin:18px 0 0;line-height:1.7}
  .hint a{color:var(--muted)}
  .bad{display:none;background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:16px;color:#C3C7DC;font-size:15px}
  :focus-visible{outline:2px solid var(--indigo);outline-offset:3px}
</style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 108 108" aria-hidden="true">
      <rect width="108" height="108" rx="26" fill="#161A54"/>
      <path d="M54 82V32M36 51l18-19 18 19" stroke="#EDEEF6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>

    <div id="ok">
      <p class="eyebrow">Shared pin</p>
      <h1 id="name">A place</h1>
      <p class="note" id="desc"></p>
      <p class="coords" id="coords"></p>

      <a class="btn btn-primary" id="openApp" href="#">Open in Loadstone</a>
      <a class="btn btn-ghost" href="https://play.google.com/store/apps/details?id=com.prempoddar.loadstone">Get Loadstone on Google Play</a>

      <p class="hint">
        Tap <b>Open in Loadstone</b> if you already have the app — the pin arrives ready to save.<br />
        <a href="../">What is Loadstone?</a>
      </p>
    </div>

    <div class="bad" id="bad">
      This link is missing its coordinates, so there is nothing to open.
      <br /><br /><a href="../">Go to Loadstone</a>
    </div>
  </div>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var lat = parseFloat(q.get('lat'));
  var lng = parseFloat(q.get('lng'));
  var name = q.get('n');
  var desc = q.get('d');

  var valid = isFinite(lat) && isFinite(lng) &&
              lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180;

  if (!valid) {
    document.getElementById('ok').style.display = 'none';
    document.getElementById('bad').style.display = 'block';
    return;
  }

  if (name) document.getElementById('name').textContent = name;
  if (desc) document.getElementById('desc').textContent = desc;
  document.getElementById('coords').textContent = lat.toFixed(5) + ', ' + lng.toFixed(5);

  // The custom scheme needs no domain verification, so it reaches the app reliably.
  document.getElementById('openApp').href = 'loadstone://open?' + q.toString();
})();
</script>
</body>
</html>
